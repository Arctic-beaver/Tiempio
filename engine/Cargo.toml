[workspace]
resolver = "2"
members = [
	"crates/protocol",
	"crates/core",
	"crates/dsp",
	"crates/synth",
	"crates/drums",
	"crates/offline-render",
	"crates/native-host",
	"crates/web-worklet"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
cpal = { version = "=0.17.3", default-features = false }
rtrb = { version = "=0.3.4", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = { version = "=0.11.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
